name: Android Build Pipeline

# ─── Triggers ──────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Direct URL to the project .zip archive"
        required: true
        type: string
      sign_release:
        description: "Sign release artifacts (requires keystore secrets)"
        required: false
        default: "false"
        type: boolean
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "scripts/**"
      - ".github/workflows/android-build.yml"
      - "Dockerfile"

# ─── Concurrency: cancel in-flight runs on same branch ─────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─── Permissions ───────────────────────────────────────────────────────────
permissions:
  contents: write
  actions: read
  checks: write

jobs:
  # ===========================================================================
  # JOB 1: Build
  # ===========================================================================
  build:
    name: "Build APK / AAB"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      OUTPUT_DIR:   ${{ github.workspace }}/build-output
      WORK_DIR:     /tmp/android_build

    steps:
      # ── Checkout pipeline scripts ─────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Set up JDK 17 ─────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      # ── Cache Android SDK ─────────────────────────────────────────────────
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/android-sdk
          key: android-sdk-34-${{ runner.os }}-v2
          restore-keys: |
            android-sdk-34-${{ runner.os }}-
            android-sdk-${{ runner.os }}-

      # ── Cache Gradle dependencies ─────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── Download project zip ──────────────────────────────────────────────
      - name: Download project archive
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          mkdir -p /tmp
          curl -fsSL "${{ github.event.inputs.zip_url }}" -o /tmp/project.zip
          echo "ZIP_FILE=/tmp/project.zip" >> $GITHUB_ENV

      # Use a sample project for push-triggered smoke tests
      - name: Use smoke-test project (push trigger)
        if: ${{ github.event_name == 'push' }}
        run: |
          echo "ZIP_FILE=smoke-test" >> $GITHUB_ENV

      # ── Make scripts executable ───────────────────────────────────────────
      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      # ── Run full build pipeline ───────────────────────────────────────────
      - name: Run build pipeline
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: build_pipeline
        run: |
          mkdir -p "$OUTPUT_DIR"

          KEYSTORE_PATH="${{ secrets.KEYSTORE_PATH || '' }}" \
          KEYSTORE_ALIAS="${{ secrets.KEYSTORE_ALIAS || '' }}" \
          KEYSTORE_PASS="${{ secrets.KEYSTORE_PASS || '' }}" \
          KEY_PASS="${{ secrets.KEY_PASS || '' }}" \
          bash scripts/build.sh "$ZIP_FILE" 2>&1 | tee "$OUTPUT_DIR/pipeline.log"

          # Capture JSON result (last JSON block in output)
          python3 -c "
          import sys, json, re
          text = open('$OUTPUT_DIR/pipeline.log').read()
          matches = re.findall(r'\{[^{}]*\"status\"[^{}]*\}', text, re.S)
          if matches:
              obj = json.loads(matches[-1])
              print('BUILD_STATUS=' + obj.get('status','FAILED'))
          else:
              print('BUILD_STATUS=FAILED')
          " >> $GITHUB_ENV

      # ── Upload APK artifact ───────────────────────────────────────────────
      - name: Upload APK
        if: ${{ github.event_name == 'workflow_dispatch' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug-${{ github.run_number }}
          path: ${{ env.OUTPUT_DIR }}/*.apk
          if-no-files-found: warn
          retention-days: 30

      # ── Upload AAB artifact ───────────────────────────────────────────────
      - name: Upload AAB
        if: ${{ github.event_name == 'workflow_dispatch' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: aab-release-${{ github.run_number }}
          path: ${{ env.OUTPUT_DIR }}/*.aab
          if-no-files-found: ignore
          retention-days: 30

      # ── Upload full logs ──────────────────────────────────────────────────
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: ${{ env.OUTPUT_DIR }}/*.log
          if-no-files-found: ignore
          retention-days: 14

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          echo "## Android Build Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Status | \`${BUILD_STATUS:-N/A}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Run | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "| Source ZIP | ${{ github.event.inputs.zip_url }} |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          ls -lh "$OUTPUT_DIR"/*.apk "$OUTPUT_DIR"/*.aab 2>/dev/null \
            | awk '{print "- `"$NF"` ("$5")"}' >> $GITHUB_STEP_SUMMARY \
            || echo "No artifacts produced." >> $GITHUB_STEP_SUMMARY

      # ── Fail job on build failure ─────────────────────────────────────────
      - name: Check build result
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "${BUILD_STATUS}" == "FAILED" ]]; then
            echo "Build FAILED — check logs artifact for details."
            exit 1
          fi

  # ===========================================================================
  # JOB 2: Lint / Validate Scripts
  # ===========================================================================
  validate-scripts:
    name: "Validate pipeline scripts"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          shellcheck -S warning scripts/build.sh
          shellcheck -S warning scripts/setup_env.sh
          shellcheck -S warning scripts/analyze_project.sh
          shellcheck -S warning scripts/sign_artifacts.sh
